---
- name: Add Proxmox VE No-Subscription Repository
  hosts: proxmox
  become: true
  gather_facts: true

  vars:
    pve_keyring: /usr/share/keyrings/proxmox-archive-keyring.gpg

  tasks:
    - name: Install python3-debian (required by deb822_repository)
      ansible.builtin.apt:
        name: python3-debian
        state: present

    - name: Check for Proxmox archive keyring (PVE 9+)
      ansible.builtin.stat:
        path: "{{ pve_keyring }}"
      register: pve_keyring_stat

    - name: Remove legacy one-line repository file
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/pve-no-subscription.list
        state: absent

    - name: Add pve-no-subscription repository
      ansible.builtin.deb822_repository:
        name: proxmox
        types: [deb]
        uris: http://download.proxmox.com/debian/pve
        # bookworm on PVE 8, trixie on PVE 9
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [pve-no-subscription]
        signed_by: "{{ pve_keyring if pve_keyring_stat.stat.exists else omit }}"
        state: present
