---
- name: Install core packages for virtual machines
  hosts: vm
  become: true

  tasks:
    - name: Install core packages for virtual machines
      ansible.builtin.apt:
        name:
          - qemu-guest-agent
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure QEMU guest agent is running
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        state: started
        enabled: true
