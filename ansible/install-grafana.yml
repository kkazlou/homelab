---
- name: Install Grafana OSS Edition
  hosts: grafana
  become: true

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian  # required by deb822_repository
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add Grafana repository
      ansible.builtin.deb822_repository:
        name: grafana
        types: [deb]
        uris: https://apt.grafana.com
        suites: [stable]
        components: [main]
        signed_by: https://apt.grafana.com/gpg.key
        state: present

    - name: Install Grafana
      ansible.builtin.apt:
        name: grafana
        state: present
        update_cache: true

    - name: Ensure Grafana service is started and enabled
      ansible.builtin.systemd_service:
        name: grafana-server
        state: started
        enabled: true
