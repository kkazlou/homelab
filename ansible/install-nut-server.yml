---
# Installs and configures Network UPS Tools (NUT) on [nut_server], the host with
# the UPS attached over USB. Settings live in inventory/group_vars/nut_server/vars.yml,
# passwords in vault.yml next to it.

- name: Install NUT server
  hosts: nut_server
  become: true
  gather_facts: false

  tasks:
    - name: Install NUT
      ansible.builtin.apt:
        name:
          - nut-client
          - nut-server
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Render nut.conf and upsd.conf
      ansible.builtin.template:
        src: "templates/nut/{{ item }}.j2"
        dest: "/etc/nut/{{ item }}"
        owner: root
        group: nut
        mode: '0640'
      loop:
        - nut.conf
        - upsd.conf
      notify:
        - Restart NUT server
        - Restart NUT monitor

    - name: Render ups.conf
      ansible.builtin.template:
        src: templates/nut/ups.conf.j2
        dest: /etc/nut/ups.conf
        owner: root
        group: nut
        mode: '0640'
      notify:
        - Reconfigure NUT drivers
        - Restart NUT driver
        - Restart NUT server

    - name: Render upsd.users
      ansible.builtin.template:
        src: templates/nut/upsd.users.j2
        dest: /etc/nut/upsd.users
        owner: root
        group: nut
        mode: '0640'
      diff: false  # contains passwords
      notify: Restart NUT server

    - name: Check the remote host SSH keys
      ansible.builtin.stat:
        path: "{{ nut_remote_ssh_dir }}/{{ item.value.key }}"
      loop: "{{ nut_remote_hosts | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: nut_remote_keys

    - name: Ensure the remote host SSH keys are in place
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'nut'
          - item.stat.mode == '0400'
        fail_msg: >-
          Copy the private key for {{ item.item.key }} to
          {{ nut_remote_ssh_dir }}/{{ item.item.value.key }} with owner nut and mode 0400.
          It is not stored in this repo.
        quiet: true
      loop: "{{ nut_remote_keys.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Create remote host SSH directory
      ansible.builtin.file:
        path: "{{ nut_remote_ssh_dir }}"
        state: directory
        owner: root
        group: nut
        mode: '0750'

    - name: Pin remote host SSH host keys
      ansible.builtin.copy:
        content: |
          {% for name, target in nut_remote_hosts.items() %}
          {{ target.host }} {{ target.host_key }}
          {% endfor %}
        dest: "{{ nut_remote_known_hosts }}"
        owner: root
        group: nut
        mode: '0640'

    # Installed before upsmon.conf, which starts using them. upssched reads
    # its config on every event, so no restart is needed.
    - name: Install NUT scripts
      ansible.builtin.template:
        src: "templates/nut/{{ item.src }}"
        dest: "/usr/local/sbin/{{ item.dest }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - { src: nut-remote.j2, dest: nut-remote }
        - { src: nut-shutdown.j2, dest: nut-shutdown }
        - { src: nut-upssched-cmd-server.j2, dest: nut-upssched-cmd }

    - name: Render upssched.conf
      ansible.builtin.template:
        src: templates/nut/upssched-server.conf.j2
        dest: /etc/nut/upssched.conf
        owner: root
        group: nut
        mode: '0640'

    - name: Render upsmon.conf
      ansible.builtin.template:
        src: templates/nut/upsmon.conf.j2
        dest: /etc/nut/upsmon.conf
        owner: root
        group: nut
        mode: '0640'
      diff: false  # contains passwords
      notify: Restart NUT monitor

    - name: Apply configuration changes
      ansible.builtin.meta: flush_handlers

    - name: Ensure NUT services are started and enabled
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - nut-driver-enumerator.path
        - nut-server.service
        - nut-monitor.service

    - name: Check that the UPS is reachable
      ansible.builtin.command: "upsc {{ nut_ups_name }}@localhost ups.status"
      register: nut_ups_status
      changed_when: false
      check_mode: false
      retries: 6
      delay: 5
      until: nut_ups_status.rc == 0

    # The UPS raises low battery itself, so the threshold lives in the UPS.
    - name: Read low battery runtime
      ansible.builtin.command: "upsc {{ nut_ups_name }}@localhost battery.runtime.low"
      register: nut_runtime_low
      changed_when: false
      check_mode: false

    - name: Set low battery runtime
      ansible.builtin.command: >-
        upsrw -s battery.runtime.low={{ nut_ups_runtime_low }}
        -u admin -p {{ nut_admin_password }} {{ nut_ups_name }}@localhost
      when: nut_runtime_low.stdout | int != nut_ups_runtime_low | int
      changed_when: true
      no_log: true  # password on the command line

    - name: Check low battery runtime
      ansible.builtin.command: "upsc {{ nut_ups_name }}@localhost battery.runtime.low"
      register: nut_runtime_low_new
      changed_when: false
      retries: 6
      delay: 5
      until: nut_runtime_low_new.stdout | int == nut_ups_runtime_low | int
      when: not ansible_check_mode

    # Fails if a host can't be reached or its restricted command changed.
    - name: Check that the remote hosts accept their shutdown keys
      ansible.builtin.command: "/usr/local/sbin/nut-remote {{ item }} check"
      loop: "{{ nut_remote_hosts.keys() | list }}"
      register: nut_remote_check
      changed_when: false
      failed_when: nut_remote_check.stdout != 'ok'
      when: not ansible_check_mode

    - name: Show UPS status
      ansible.builtin.debug:
        msg: "{{ nut_ups_name }}: {{ nut_ups_status.stdout }}"

  # Handlers run in the order they are defined here.
  handlers:
    # Regenerates the nut-driver@<ups> instances from ups.conf.
    - name: Reconfigure NUT drivers
      ansible.builtin.systemd_service:
        name: nut-driver-enumerator.service
        state: restarted

    # The enumerator may only live-reload a running driver, which skips device matching.
    - name: Restart NUT driver
      ansible.builtin.systemd_service:
        name: "nut-driver@{{ nut_ups_name }}.service"
        state: restarted

    - name: Restart NUT server
      ansible.builtin.systemd_service:
        name: nut-server.service
        state: restarted

    - name: Restart NUT monitor
      ansible.builtin.systemd_service:
        name: nut-monitor.service
        state: restarted
