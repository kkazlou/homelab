---
# Network UPS Tools client (https://networkupstools.org)
# Connects to the first host of [nut_server] with that group's monuser account.
nut_mode: netclient

nut_client_server: "{{ groups['nut_server'][0] }}"
nut_client_ups: "{{ hostvars[nut_client_server]['nut_ups_name'] }}@{{ nut_client_server }}"
nut_client_password: "{{ hostvars[nut_client_server]['nut_monuser_password'] }}"

# Run by upsmon when the NUT server signals a shutdown. Proxmox stops its guests first.
nut_client_shutdown_command: /sbin/shutdown -h +0

# Shut down after this many seconds on battery, so that the NAS (which waits for
# low battery) is still up while guests stop.
nut_client_onbatt_shutdown_delay: 300
nut_client_upssched_cmd: /usr/local/sbin/nut-upssched-cmd
