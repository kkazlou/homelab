---
# Network UPS Tools (https://networkupstools.org)
# Secrets live in vault.yml (ansible-vault encrypted).
nut_mode: netserver
nut_listen_address: 0.0.0.0
nut_listen_port: 3493
# Clients connect to this address, so they don't depend on DNS (the UDM-Pro).
nut_server_address: 192.168.2.12

# Rendered as-is into ups.conf. `nut-scanner -U` prints these for attached UPSes.
# Leave out bus, device and busport: they can change on replug or reboot.
nut_ups_name: ups
nut_ups_options:
  driver: usbhid-ups
  port: auto
  vendorid: 051D
  productid: "0003"
  desc: Smart-UPS 750
  serial: 3S2025X18231
  vendor: American Power Conversion

# admin is used by the local upsmon and by the playbook (upsrw). It has no instant
# commands on purpose: those include load.off, which cuts power to everything.
# monuser is used by remote clients; the Synology requires that name and password.
nut_admin_password: "{{ vault_nut_admin_password }}"
nut_monuser_password: "{{ vault_nut_monuser_password }}"

# Low battery signal: the UPS raises it at this many seconds of runtime left.
# Stored in the UPS itself; the playbook sets it with upsrw.
nut_ups_runtime_low: 300

# Run by upsmon at low battery, after the remote hosts have been powered off.
nut_shutdown_command: /sbin/shutdown -h +0
nut_shutdown_script: /usr/local/sbin/nut-shutdown

# UniFi devices on the same UPS. They can't run NUT, so this host powers them off
# over SSH as the nut user (nut-remote <name> check|poweroff). On each device the
# key is restricted to /root/nut-ssh-cmd.sh, which accepts only `check` and
# `poweroff`. Private keys are not in this repo: copy each to nut_remote_ssh_dir,
# owner nut, mode 0400.
nut_remote_ssh_dir: /etc/nut/ssh
nut_remote_known_hosts: "{{ nut_remote_ssh_dir }}/known_hosts"
nut_remote_hosts:
  unas:  # UniFi UNAS Pro
    host: 192.168.2.3
    user: root
    key: unas_ed25519
    host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA1WNxyeL9EeMZZ+CUOKc6ti4wQKiFxfMpUj6CUkHYT8
  udm:  # UniFi UDM-Pro, the router; powered off last
    host: 192.168.2.1
    user: root
    key: udm_ed25519
    host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEu5jaBGkXOcsrS+5tGpPsXQnUQTVHiWBZStnFhzy8y9

# Power off the UNAS after this many seconds on battery. Low battery powers it off too.
nut_unas_onbatt_shutdown_delay: 300
